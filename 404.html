<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost in the mist · Hanjing Shi</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root { color-scheme: light dark; --bg: #f3efe6; --ink: #1f1c19; --muted: #6e675d; --accent: #b8322a; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f1318; --ink: #ece6da; --muted: #9d968a; --accent: #e0654f; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
            background: radial-gradient(ellipse at 50% 60%, transparent, rgba(0, 0, 0, .06)), var(--bg);
            color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; text-align: center; }
        .seal { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 10px; background: var(--accent);
            color: #fff7f2; font: 600 20px Fraunces, Georgia, serif; transform: rotate(-4deg); }
        h1 { font: 600 clamp(30px, 6vw, 44px)/1.1 Fraunces, Georgia, serif; margin: 20px 0 8px; }
        p { color: var(--muted); margin: 0 0 22px; }
        a { color: var(--accent); font-weight: 500; margin: 0 10px; }
    </style>
</head>

<body>
    <main>
        <span class="seal" aria-hidden="true">HS</span>
        <h1>Lost in the mist</h1>
        <p>This path doesn't lead anywhere (yet).</p>
        <a href="/index.html?world">Back to my world</a>
        <a href="/basic.html">Basic version</a>
    </main>
</body>

</html>
